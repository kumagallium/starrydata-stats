# 毎日 JST 6:00 に最新データを取得して集計し、ダッシュボードを GitHub Pages に公開する。
# main への push 時は(再集計せず)現在の dashboard.html をそのままデプロイする。
# public リポジトリのため GitHub Actions の実行時間は無料枠を消費しない。
name: update-dashboard

on:
  schedule:
    - cron: "0 21 * * *" # JST 6:00(Starrydata のスナップショットは JST 2:00 頃生成)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: uv をセットアップ
        if: github.event_name != 'push'
        uses: astral-sh/setup-uv@v5

      - name: 最新データを取得して集計
        if: github.event_name != 'push'
        run: uv run aggregate_stats.py --download

      - name: 集計結果をコミット
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output dashboard.html
          if git diff --cached --quiet; then
            echo "変更なし(データ未更新)"
          else
            git commit -m "自動更新: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')"
            git push
          fi

      - name: Pages 用に配置
        run: |
          mkdir -p _site
          cp dashboard.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
