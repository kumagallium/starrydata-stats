# Fetches the latest data daily at 6:00 JST, re-aggregates, and publishes the
# dashboard to GitHub Pages. Pushes to main redeploy the current dashboard.html
# without re-aggregating. Actions minutes are free for public repositories.
name: update-dashboard

on:
  schedule:
    - cron: "0 21 * * *" # 6:00 JST (the Starrydata snapshot is generated around 2:00 JST)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        if: github.event_name != 'push'
        uses: astral-sh/setup-uv@v5

      - name: Fetch the latest dataset and aggregate
        if: github.event_name != 'push'
        run: uv run aggregate_stats.py --download

      - name: Commit aggregation results
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output dashboard.html
          if git diff --cached --quiet; then
            echo "No changes (dataset not updated)"
          else
            git commit -m "chore: auto-update $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')"
            git push
          fi

      - name: Stage site for Pages
        run: |
          mkdir -p _site
          cp dashboard.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
